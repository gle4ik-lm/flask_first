<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>edit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<header class="header">

    <nav class="navbar bg-dark mb-4" data-bs-theme="dark">
        <div class="container">
            <div class="logo">
                <a class="navbar-brand" href="{{ url_for('products') }}">
                    <img src="{{ url_for('static', filename='image/cart.png') }}" style="filter: invert(100%)"
                     alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                    <span class="navbar-brand m-1 h1">Update</span>
                </a>
            </div>
        </div>
     </nav>
</header>

<main>
    <div class="container">
    <p class="fw-bold">Редагування товару</p>

    <p class="fw-light"> {{ name }}</p>

        <form method="POST" class="row g-3 mb-4">

            <div class="mb-4">
            <label for="exampleFormControlInput1" class="form-label">Price</label>
            <input type="number" class="form-control border-success" name="edit_price" id="exampleFormControlInput1" placeholder="{{ price }}">
            </div>

            <div class="mb-4">
            <label for="exampleFormControlInput1" class="form-label">category</label>
            <input type="text" class="form-control border-success" name="edit_price" placeholder="{{ category }}">
            </div>

            <div class="col-md-2">
                <button class="form-control btn btn-dark" type="submit">Update</button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
